name: DIAG lab (temporary)
on:
  push:
    branches: ["arena/**"]
    paths: ["scripts/diag_lab.py", "scripts/diag_lab2.py", "scripts/diag_lab3.py", ".github/workflows/diag.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run diagnostics v1
        run: python3 scripts/diag_lab.py || true
      - name: Run diagnostics v2
        run: python3 scripts/diag_lab2.py || true
      - name: Run diagnostics v3
        run: python3 scripts/diag_lab3.py || true
      - name: Commit diagnostics
        run: |
          git config user.name "diag-bot"; git config user.email "actions@github.com"
          git add data/diag
          git diff --cached --quiet || git commit -m "diag: lab report [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: data/diag
