name: Audit external sources (read-only)

# Session arena/e76bc0ae / T17. This workflow only observes endpoints and writes
# audit/source_probe.json + audit/source_probe.md. It never touches docs/data/.
on:
  workflow_dispatch:
  push:
    branches: ["arena/e76bc0ae-lolhotspawn2"]
    paths:
      - "audit/probe_sources.py"
      - ".github/workflows/audit-sources.yml"

permissions:
  contents: write

concurrency:
  group: audit-sources-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe external sources
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 audit/probe_sources.py

      - name: Commit the audit output
        run: |
          git config user.name "audit-bot"
          git config user.email "actions@github.com"
          git add audit/source_probe.json audit/source_probe.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "audit: external source probe [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
