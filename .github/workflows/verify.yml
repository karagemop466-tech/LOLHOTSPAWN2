name: Verify picks and site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/verify_site.py"
      - "data/diag/**"
      - ".github/workflows/verify.yml"
  schedule:
    - cron: "30 */6 * * *"   # 30 minutes after the picks refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-site
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier self-tests (each rule must fail on bad data)
        run: |
          python3 verification/test_provenance.py
          python3 verification/test_verifier.py

      - name: Evidence scope regression tests
        run: python3 verification/test_evidence_scope.py

      - name: Fixture-coverage union unit tests (lobby + fixtures API)
        run: python3 verification/test_lobby_union.py

      - name: Verify data + site (offline)
        run: python3 scripts/verify_site.py --leaguepedia-schedule data/diag

      - name: Verify external source links and the live Pages deployment
        run: |
          python3 scripts/verify_site.py \
            --check-external \
            --live-url https://karagemop466-tech.github.io/LOLHOTSPAWN2/

      - name: Coverage audit (is every model row backed by a Leaguepedia page?)
        run: |
          python3 verification/check_leaguepedia_coverage.py \
            --rows model --schedule-dir data/diag \
            --out verification/leaguepedia_coverage.json \
            --md verification/leaguepedia_coverage.md

      - name: DOM/mobile contract (ids, header skeleton, class coverage, no dead controls)
        run: python3 verification/check_dom_contract.py

      - name: DOM contract negative self-tests (each rule must fail on a broken page)
        run: python3 verification/test_dom_contract.py

      - name: Cited Leaguepedia source pages must exist (HTTP 200 is not enough)
        run: |
          set +e
          python3 verification/check_source_pages.py
          rc=$?
          if [ "$rc" = "2" ]; then
            echo "::warning title=Source page check skipped::Leaguepedia API was unreachable; page existence not verified in this run"
            exit 0
          fi
          exit "$rc"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render checks (jsdom executes the real pages against the payload)
        run: |
          npm i --no-save --no-audit --no-fund --no-package-lock jsdom@30.1.3 playwright@1.64.1 @sparticuz/chromium@153.0.0
          node verification/render_check.cjs
          node verification/check_dom_render.js
          node verification/test_freshness.cjs

      - name: Real mobile browser audit (320, 390, 768, 1280px)
        run: |
          python3 -m http.server 8080 --bind 0.0.0.0 > "$RUNNER_TEMP/mobile-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          MOBILE_REPORT="$RUNNER_TEMP/mobile-browser.json" node verification/check_mobile_browser.cjs

      - name: Upload mobile browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser
          path: ${{ runner.temp }}/mobile-browser.json

      - name: Real phone and tablet layout checks (Chromium)
        run: |
          set -o pipefail
          mkdir -p data/diag
          {
            npm install --no-save --no-package-lock --no-audit --no-fund jsdom@30.1.3 playwright@1.64.1 playwright-core@1.64.1 @sparticuz/chromium@153.0.0
            BROWSER_REPORT=data/diag/browser.json node verification/check_browser.cjs
          } 2>&1 | tee data/diag/browser.log

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: verification/
          retention-days: 30
