name: Verify picks and site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/verify_site.py"
      - "data/diag/**"
      - ".github/workflows/verify.yml"
  schedule:
    - cron: "30 */6 * * *"   # 30 minutes after the picks refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-site
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier self-tests (each rule must fail on bad data)
        run: python3 verification/test_verifier.py

      - name: Verify data + site (offline)
        run: python3 scripts/verify_site.py --leaguepedia-schedule data/diag

      - name: Verify external source links and the live Pages deployment
        run: |
          python3 scripts/verify_site.py \
            --check-external \
            --live-url https://karagemop466-tech.github.io/LOLHOTSPAWN2/

      - name: Coverage audit (is every model row backed by a Leaguepedia page?)
        run: |
          python3 verification/check_leaguepedia_coverage.py \
            --rows model --schedule-dir data/diag \
            --out verification/leaguepedia_coverage.json \
            --md verification/leaguepedia_coverage.md

      - name: DOM contract (every id the JS uses exists in the pages)
        run: python3 verification/check_dom_contract.py

      - name: Render checks (jsdom executes the real pages against the payload)
        run: |
          npm i --no-save --no-audit --no-fund --no-package-lock jsdom >/dev/null 2>&1 || \
            echo "jsdom not installed; render checks will SKIP"
          node verification/render_check.cjs
          node verification/check_dom_render.js

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: verification/
          retention-days: 30
