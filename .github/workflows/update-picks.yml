name: Update Hotspawn LoL picks (every 6h)

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC (requested 4-8h cadence)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/aliases.json"
      - ".github/workflows/update-picks.yml"

permissions:
  contents: write

concurrency:
  group: picks-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rebase needs history; shallow clones make `pull --rebase` fail (exit 128)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fixtures, external lines and results; build picks
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail  # a generator failure must fail the step, not be masked by tee
          mkdir -p data/diag
          python3 scripts/update_picks.py 2>&1 | tee data/diag/pipeline.log

      - name: Verify the published payload
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("docs/data/picks.json"))
          errs = []
          if d.get("schema_version") != 3:
              errs.append(f"schema_version={d.get('schema_version')!r}")
          ms = d.get("matches") or []
          if len(ms) < 50:
              errs.append(f"only {len(ms)} fixtures")
          methods = {"MARKET_CONSENSUS", "MARKET_SINGLE", "MODEL_ELO", "MODEL_ELO_THIN",
                     "MODEL_ELO_STANDINGS", "MODEL_STANDINGS", "MODEL_LEAGUE_PRIOR", "UNRESOLVED"}
          for m in ms:
              if m["method"] not in methods:
                  errs.append(f"bad method {m['method']} for {m['team1']} vs {m['team2']}")
              if m["pick"] not in (m["team1"], m["team2"]):
                  errs.append(f"pick not a team: {m['team1']} vs {m['team2']}")
              if abs(m["prob_team1"] + m["prob_team2"] - 1) > 0.005:
                  errs.append(f"probabilities do not sum to 1: {m['id']}")
              if not m.get("sources"):
                  errs.append(f"no source link: {m['id']}")
              if m["method"] == "UNRESOLVED" and m["pick_prob"] != 0.5:
                  errs.append(f"unresolved row is not 50/50: {m['id']}")
          cov = d.get("coverage") or {}
          if cov.get("published_picks") != len(ms):
              errs.append("coverage.published_picks mismatch")
          print(json.dumps({"counts": d["counts"], "coverage": cov}, indent=1))
          if errs:
              print("VERIFICATION FAILED", file=sys.stderr)
              print("\n".join(errs[:25]), file=sys.stderr)
              raise SystemExit(1)
          print(f"verified {len(ms)} fixtures")
          PY
          python3 scripts/verify_site.py

      - name: Commit the failure log (if this run failed)
        if: failure()
        run: |
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add data/diag/pipeline.log || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "picks: failure log [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Commit the refreshed data
        run: |
          set -euo pipefail
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add docs/data data/diag/pipeline.log
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "picks: scheduled refresh [skip ci]"
          # Discard unstaged verifier reports so concurrent PR merges into main
          # never fail git merge due to dirty verification/report.json.
          git checkout -- verification/ 2>/dev/null || true
          # Merge-based retry: a rebase here can strand the worktree mid-rebase
          # and lose the refresh for a whole 6h cycle. Keep this run's payload.
          for attempt in 1 2 3 4 5; do
            if ! git fetch -q origin "${GITHUB_REF_NAME}"; then
              echo "fetch failed on attempt ${attempt}" >&2; sleep 5; continue
            fi
            if ! git merge --no-edit -X ours "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              git merge --abort >/dev/null 2>&1 || true
              echo "merge failed on attempt ${attempt}" >&2; sleep 5; continue
            fi
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            git reset --hard HEAD~1 >/dev/null 2>&1 || true
            echo "push rejected on attempt ${attempt}; retrying" >&2
            sleep 5
          done
          echo "could not push the refreshed payload after 5 attempts" >&2
          exit 1
