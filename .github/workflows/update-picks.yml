name: Update Hotspawn LoL picks (every 6h)
on:
  schedule: [{cron: "0 */6 * * *"}]   # every 6 hours (requested 4-8h)
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: picks-update, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scrape Hotspawn + price every match
        env: {ODDSPAPI_KEY: "${{ secrets.ODDSPAPI_KEY }}"}
        run: python3 scripts/update_picks.py
      - name: Verify data (every match must have a pick + probabilities sum to 1)
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('docs/data/picks.json')); assert d['count']>0, "no matches"
          for m in d['matches']:
              assert m['pick'] in (m['team1'],m['team2']), m
              assert abs(m['prob_team1']+m['prob_team2']-1)<0.01, m
              assert m['method'] in ('MARKET_BOOKS','MARKET_POLYMARKET','MODEL_ELO','UNRESOLVED'), m
          print("verified", d['count'], d['counts_by_method'])
          PY
      - name: Commit updated picks
        run: |
          git config user.name "picks-bot"; git config user.email "actions@github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "picks: scheduled 6h update"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deploy
        uses: actions/deploy-pages@v4
