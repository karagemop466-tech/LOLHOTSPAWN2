name: Pipeline test (branch verification)

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/pipeline-test.yml"

permissions:
  contents: write

concurrency:
  group: pipeline-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # artifact push/rebase must have complete branch history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the live pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data/diag
          python3 scripts/update_picks.py 2>&1 | tee data/diag/pipeline.log

      - name: Summarise the run
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = "docs/data/picks.json"
          if not os.path.exists(p):
              print("no payload produced"); raise SystemExit(0)
          d = json.load(open(p))
          print(json.dumps(d.get("counts"), indent=1))
          print(json.dumps(d.get("coverage"), indent=1))
          print(json.dumps(d.get("unresolved"), indent=1)[:1200])
          print(json.dumps(d.get("sources_status"), indent=1)[:1600])
          PY

      - name: Verify the published site
        if: always()
        run: python3 scripts/verify_site.py

      - name: Commit outputs for review
        if: always()
        run: |
          set -euo pipefail
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add docs/data data/diag/pipeline.log data/diag/verify.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "pipeline: test run [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # During rebase, the generated-output commit is "theirs", so keep
            # its fresh payload on conflicts. If rebase cannot complete, merge
            # the remote branch and prefer this workflow's generated artifacts.
            if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              if ! git rebase --abort; then
                echo "could not abort failed output rebase" >&2
                exit 1
              fi
              git merge --no-edit -X ours "origin/${GITHUB_REF_NAME}"
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed outputs on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "push failed on attempt ${attempt}; fetching latest branch and retrying" >&2
              sleep 5
            fi
          done
          echo "could not publish pipeline outputs after 3 attempts" >&2
          exit 1
