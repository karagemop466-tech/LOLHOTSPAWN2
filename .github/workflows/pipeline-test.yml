name: Pipeline test (branch verification)

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/pipeline-test.yml"

permissions:
  contents: write

concurrency:
  group: pipeline-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # artifact push/rebase must have complete branch history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the live pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data/diag
          python3 scripts/update_picks.py 2>&1 | tee data/diag/pipeline.log

      - name: Summarise the run
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = "docs/data/picks.json"
          if not os.path.exists(p):
              print("no payload produced"); raise SystemExit(0)
          d = json.load(open(p))
          print(json.dumps(d.get("counts"), indent=1))
          print(json.dumps(d.get("coverage"), indent=1))
          print(json.dumps(d.get("unresolved"), indent=1)[:1200])
          print(json.dumps(d.get("sources_status"), indent=1)[:1600])
          PY

      - name: Verify the published site
        if: always()
        run: python3 scripts/verify_site.py

      - name: Commit outputs for review (best effort, never fails the check)
        if: always()
        run: |
          set -uo pipefail
          # This step only publishes the generated payload for review. The strict
          # audit workflow and the scheduled publisher are the authoritative
          # writers, so a push race here must not turn a green verification red.
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          echo "--- working tree before staging ---"
          git status --porcelain || true
          git add -A docs/data data/diag/pipeline.log data/diag/verify.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no output changes to publish"
            exit 0
          fi
          git commit -m "pipeline: test run [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            if ! git fetch -q origin "${GITHUB_REF_NAME}"; then
              echo "fetch failed on attempt ${attempt}" >&2; sleep 5; continue
            fi
            # Keep this run's freshly generated payload if both sides changed it.
            if ! git merge --no-edit -X ours "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              git merge --abort >/dev/null 2>&1 || true
              echo "merge failed on attempt ${attempt}" >&2; sleep 5; continue
            fi
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "published pipeline outputs on attempt ${attempt}"
              exit 0
            fi
            # Lost a push race: drop our merge commit and retry from the fresh tip.
            git reset --hard HEAD~1 >/dev/null 2>&1 || true
            echo "push rejected on attempt ${attempt}; retrying" >&2
            sleep 5
          done
          echo "could not publish outputs after 5 attempts (best effort; verification still passed)" >&2
          exit 0
