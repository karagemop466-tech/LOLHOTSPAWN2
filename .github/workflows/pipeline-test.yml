name: Pipeline test (branch verification)

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/pipeline-test.yml"

permissions:
  contents: write

concurrency:
  group: pipeline-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe candidate betting sources (measured evidence)
        continue-on-error: true
        run: |
          mkdir -p data/diag
          python3 scripts/probe_markets.py 2>&1 | tee -a data/diag/pipeline.log

      - name: Run the live pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p data/diag
          python3 scripts/update_picks.py 2>&1 | tee data/diag/pipeline.log

      - name: Summarise the run
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = "docs/data/picks.json"
          if not os.path.exists(p):
              print("no payload produced"); raise SystemExit(0)
          d = json.load(open(p))
          print(json.dumps(d.get("counts"), indent=1))
          print(json.dumps(d.get("coverage"), indent=1))
          print(json.dumps(d.get("unresolved"), indent=1)[:1200])
          print(json.dumps(d.get("sources_status"), indent=1)[:1600])
          PY

      - name: Verify the published site
        if: always()
        run: python3 scripts/verify_site.py

      - name: Commit outputs for review
        if: always()
        run: |
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add docs/data data/diag/pipeline.log data/diag/verify.json data/diag/market_probe.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "pipeline: test run [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
