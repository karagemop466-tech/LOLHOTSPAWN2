name: Pipeline test (branch verification)

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/pipeline-test.yml"

permissions:
  contents: write

concurrency:
  group: pipeline-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # artifact push/rebase must have complete branch history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the live pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data/diag
          python3 scripts/update_picks.py 2>&1 | tee data/diag/pipeline.log

      - name: Summarise the run
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = "docs/data/picks.json"
          if not os.path.exists(p):
              print("no payload produced"); raise SystemExit(0)
          d = json.load(open(p))
          print(json.dumps(d.get("counts"), indent=1))
          print(json.dumps(d.get("coverage"), indent=1))
          print(json.dumps(d.get("unresolved"), indent=1)[:1200])
          print(json.dumps(d.get("sources_status"), indent=1)[:1600])
          PY

      - name: Verify the published site
        if: always()
        run: python3 scripts/verify_site.py

      - name: Commit outputs for review
        if: always()
        run: |
          set -euo pipefail
          fail_publish() {
            local message
            message="$(printf '%s' "$1" | tr '\r\n' '  ')"
            echo "::error title=Pipeline artifact publish::${message}"
            {
              echo "## Pipeline artifact publish failed"
              echo
              echo "${message}"
              echo
              echo "Branch: \`${GITHUB_REF_NAME}\` · local HEAD: \`$(git rev-parse --short HEAD)\`"
              if git rev-parse --verify "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                remote_head="$(git rev-parse --short "origin/${GITHUB_REF_NAME}")"
                echo "Remote HEAD: \`${remote_head}\`"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          # verify_site.py updates report.json and last_report.md; stage them
          # with the payload so a rebase never encounters leftover worktree edits.
          if out=$(git add docs/data data/diag/pipeline.log data/diag/verify.json data/diag/source_probe.json verification/report.json verification/last_report.md 2>&1); then
            :
          else
            rc=$?
            fail_publish "git add failed (${rc}): ${out}"
          fi
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          if out=$(git commit -m "pipeline: test run [skip ci]" 2>&1); then
            echo "$out"
          else
            rc=$?
            fail_publish "git commit failed (${rc}): ${out}"
          fi
          last_push_error="no push attempt"
          for attempt in 1 2 3; do
            if out=$(git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" 2>&1); then
              echo "$out"
            else
              rc=$?
              fail_publish "git fetch failed on attempt ${attempt} (${rc}): ${out}"
            fi
            # During rebase, the generated-output commit is "theirs", so keep
            # its fresh payload on conflicts. If rebase cannot complete, merge
            # the remote branch and prefer this workflow's generated artifacts.
            if out=$(git rebase -X theirs "origin/${GITHUB_REF_NAME}" 2>&1); then
              echo "$out"
            else
              rc=$?
              echo "rebase needs fallback merge: ${out}" >&2
              if abort_out=$(git rebase --abort 2>&1); then
                echo "$abort_out"
              else
                abort_rc=$?
                fail_publish "could not abort failed output rebase (${abort_rc}): ${abort_out}"
              fi
              if merge_out=$(git merge --no-edit -X ours "origin/${GITHUB_REF_NAME}" 2>&1); then
                echo "$merge_out"
              else
                merge_rc=$?
                fail_publish "fallback merge failed (${merge_rc}): ${merge_out}"
              fi
            fi
            if out=$(git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1); then
              echo "$out"
              echo "pushed outputs on attempt ${attempt}"
              exit 0
            else
              rc=$?
              last_push_error="attempt ${attempt} (${rc}): ${out}"
              echo "push failed on ${last_push_error}" >&2
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "fetching latest branch and retrying" >&2
              sleep 5
            fi
          done
          remote_head="unknown"
          if git rev-parse --verify "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            remote_head="$(git rev-parse --short "origin/${GITHUB_REF_NAME}")"
          fi
          fail_publish "git push failed after 3 attempts; branch=${GITHUB_REF_NAME}, remote=${remote_head}, last_error=${last_push_error}"
